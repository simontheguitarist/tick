# Self-hosting tick's sync server:
#   cp deploy/.env.example deploy/.env   # then set TICK_TOKEN
#   docker compose -f deploy/docker-compose.yml up -d --build
# Put TLS in front of it (reverse proxy of your choice) before leaving your LAN.
services:
  tickd:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      TICK_TOKEN: ${TICK_TOKEN:?TICK_TOKEN is required — generate one with `openssl rand -hex 32`}
      TICK_LANDING_URL: ${TICK_LANDING_URL:-https://github.com/simontheguitarist/tick}
    ports:
      - "${TICK_PORT:-8080}:8080"
    volumes:
      - tick_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  tick_data:
